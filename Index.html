<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieFlix</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
background:#141414;
color:white;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:#000;
position:sticky;
top:0;
z-index:100;
}

.logo{
color:#e50914;
font-size:32px;
font-weight:bold;
}

.search{
padding:10px;
border:none;
border-radius:6px;
width:220px;
}

.hero{
height:70vh;
background:
linear-gradient(to top,#141414,transparent),
url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600");
background-size:cover;
background-position:center;
display:flex;
align-items:flex-end;
padding:50px;
}

.hero-content{
max-width:600px;
}

.hero h1{
font-size:48px;
margin-bottom:15px;
}

.hero p{
line-height:1.7;
color:#ddd;
}

.section{
padding:25px;
}

.section h2{
margin-bottom:15px;
}

.movies{
display:flex;
gap:15px;
overflow-x:auto;
padding-bottom:10px;
}

.movies::-webkit-scrollbar{
height:8px;
}

.movie{
min-width:220px;
background:#222;
border-radius:10px;
overflow:hidden;
transition:.3s;
}

.movie:hover{
transform:scale(1.05);
}

.movie img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:12px;
}

.rating{
color:gold;
margin-top:8px;
}

footer{
text-align:center;
padding:25px;
background:#000;
margin-top:20px;
}
</style>
</head>

<body>

<nav>
<div class="logo">MOVIEFLIX</div>
<input type="text" id="search" class="search" placeholder="ابحث عن فيلم...">
</nav>

<section class="hero">
<div class="hero-content">
<h1>أفضل الأفلام في مكان واحد</h1>
<p>استكشف مجموعة رائعة من الأفلام الكلاسيكية والحديثة.</p>
</div>
</section>

<section class="section">
<h2>الأفلام الشائعة</h2>

<div class="movies">

<div class="movie">
<img src="https://upload.wikimedia.org/wikipedia/en/8/8a/Dark_Knight.jpg">
<div class="info">
<h3>The Dark Knight</h3>
<div class="rating">⭐ 9.0</div>
</div>
</div>

<div class="movie">
<img src="https://upload.wikimedia.org/wikipedia/en/7/7f/Inception_ver3.jpg">
<div class="info">
<h3>Inception</h3>
<div class="rating">⭐ 8.8</div>
</div>
</div>

<div class="movie">
<img src="https://upload.wikimedia.org/wikipedia/en/b/bc/Interstellar_film_poster.jpg">
<div class="info">
<h3>Interstellar</h3>
<div class="rating">⭐ 8.7</div>
</div>
</div>

<div class="movie">
<img src="https://upload.wikimedia.org/wikipedia/en/1/13/Avengers_Endgame_poster.jpg">
<div class="info">
<h3>Avengers: Endgame</h3>
<div class="rating">⭐ 8.4</div>
</div>
</div>

</div>
</section>

<footer>
MovieFlix © 2026
</footer>

<script>
document.getElementById("search").addEventListener("keyup", function(){
let value = this.value.toLowerCase();

document.querySelectorAll(".movie").forEach(movie=>{
movie.style.display =
movie.innerText.toLowerCase().includes(value)
? "block"
: "none";
});
});
</script>

</body>
                                                        </html>
