<img src="https://upload.wikimedia.org/wikipedia/en/a/a5/Grand_Theft_Auto_V.png"><!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA V Guide</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
}

header{
background:url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200') center/cover;
height:300px;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
font-weight:bold;
}

.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1e1e1e;
border-radius:15px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card h2{
padding:10px;
font-size:20px;
}

.card p{
padding:0 10px 15px;
color:#ccc;
}
</style>
</head>

<body>

<header>GTA V GUIDE</header>

<div class="container">

<div class="card">
<img src="https://static.wikia.nocookie.net/gtawiki/images/8/86/Adder-GTAV-front.png">
<h2>السيارات النادرة</h2>
<p>أفضل السيارات وأماكن العثور عليها.</p>
</div>

<div class="card">
<img src="https://static.wikia.nocookie.net/gtawiki/images/4/42/TrevorPhilips-GTAV.png">
<h2>تريفور</h2>
<p>دليل مهام وأسرار شخصية تريفور.</p>
</div>

<div class="card">
<img src="https://static.wikia.nocookie.net/gtawiki/images/5/5d/SpaceshipParts-GTAV.jpg">
<h2>أجزاء المركبة الفضائية</h2>
<p>أماكن جميع القطع الـ50.</p>
</div>

<div class="card">
<img src="https://static.wikia.nocookie.net/gtawiki/images/b/b0/Cash-GTAV.jpg">
<h2>جمع المال</h2>
<p>أفضل طرق الربح في طور القصة.</p>
</div>

</div>

</body>
</html>
